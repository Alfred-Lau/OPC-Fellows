<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Rail chrome fixture</title>
    <link rel="stylesheet" href="../src/renderer/src/theme.css" />
    <link rel="stylesheet" href="../src/renderer/src/studio-theme.css" />
    <link rel="stylesheet" href="../src/renderer/src/studio.css" />
    <link rel="stylesheet" href="../src/renderer/src/app.css" />
  </head>
  <body data-view="home" data-rail="open">
    <aside class="rail">
      <div class="rail-gutter" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度"></div>
      <button type="button" id="rail-toggle" class="rail-toggle" aria-expanded="true" aria-label="收起目录">‹</button>
      <div class="rail-actions">
        <button type="button" title="今日">
          <span class="nav-mark">今</span>
          <span class="nav-label">今日</span>
        </button>
        <button type="button" title="新任务">
          <span class="nav-mark">新</span>
          <span class="nav-label">新任务</span>
        </button>
      </div>
      <div class="rail-scroll">
        <div class="rail-kicker-row">
          <p class="rail-kicker">AGENTS</p>
        </div>
        <nav class="rail-list" aria-label="Agents">
          <button type="button">
            <span class="agent-avatar" data-hue="5">
              <img src="../src/renderer/assets/avatars/micro.png" alt="" />
            </span>
            <span class="nav-label">选品策略师</span>
          </button>
          <button type="button">
            <span class="agent-avatar" data-hue="7">
              <img src="../src/renderer/assets/avatars/social-ammo.png" alt="" />
            </span>
            <span class="nav-label">社媒弹药手</span>
          </button>
          <button type="button">
            <span class="agent-avatar" data-hue="1">
              <img src="../src/renderer/assets/avatars/payments.png" alt="" />
            </span>
            <span class="nav-label">财务顾问</span>
          </button>
          <button type="button">
            <span class="agent-avatar" data-hue="6">
              <img src="../src/renderer/assets/avatars/wxdraft.png" alt="" />
            </span>
            <span class="nav-label">公众号编辑</span>
          </button>
          <button type="button">
            <span class="agent-avatar" data-hue="0">
              <img src="../src/renderer/assets/avatars/notes.png" alt="" />
            </span>
            <span class="nav-label">随手记</span>
          </button>
          <button type="button">
            <span class="agent-avatar" data-hue="5">
              <img src="../src/renderer/assets/avatars/wxhub.png" alt="" />
            </span>
            <span class="nav-label">微信情报官</span>
          </button>
          <button type="button">
            <span class="agent-avatar" data-hue="3">
              <img src="../src/renderer/assets/avatars/monitor.png" alt="" />
            </span>
            <span class="nav-label">项目监控官</span>
          </button>
          <button type="button">
            <span class="agent-avatar" data-hue="2">
              <img src="../src/renderer/assets/avatars/accounts.png" alt="" />
            </span>
            <span class="nav-label">自媒体账号</span>
          </button>
          <button type="button">
            <span class="agent-avatar" data-hue="3">
              <img src="../src/renderer/assets/avatars/harness.png" alt="" />
            </span>
            <span class="nav-label">DeepSeek 工作台</span>
          </button>
        </nav>
      </div>
      <div class="rail-foot">
        <div class="rail-user-wrap">
          <button type="button" id="rail-user" class="rail-user" aria-expanded="false" aria-haspopup="menu">
            <span class="agent-avatar" data-hue="4">
              <img src="../src/renderer/assets/avatars/user.png" alt="" />
            </span>
            <span class="nav-label">用户中心</span>
          </button>
          <div id="rail-user-pop" class="rail-user-pop" hidden role="menu">
            <p class="rail-user-kicker">外观</p>
            <div class="appearance" role="group" aria-label="外观">
              <button type="button" data-theme-pref="system">系统</button>
              <button type="button" data-theme-pref="dark" class="is-current">深色</button>
              <button type="button" data-theme-pref="light">浅色</button>
            </div>
            <button type="button" id="rail-settings" class="rail-user-item">设置</button>
          </div>
        </div>
      </div>
    </aside>
    <div class="studio">
      <section class="thread-pane">
        <header class="thread-head">
          <div class="thread-head-copy">
            <span class="thread-face">
              <span class="agent-avatar" data-hue="5">
                <img src="../src/renderer/assets/avatars/micro.png" alt="" />
              </span>
            </span>
            <div>
              <h1>选品策略师</h1>
              <p class="thread-meta">@选品策略师</p>
            </div>
          </div>
        </header>
        <div class="thread-body">
          <div class="thread-feed">
            <article class="thread-msg is-agent">
              <div class="thread-msg-row">
                <span class="agent-avatar" data-hue="5">
                  <img src="../src/renderer/assets/avatars/micro.png" alt="" />
                </span>
                <div class="thread-msg-body">
                  <p class="thread-msg-who">选品策略师</p>
                  <div class="bubble">今天从 Ask HN 捞到三个愿意付钱的痛点，要不要我先拆成待办？</div>
                </div>
              </div>
            </article>
            <article class="thread-msg is-user">
              <div class="thread-msg-row">
                <div class="bubble">先看第一条，帮我写进收件箱。</div>
                <span class="agent-avatar" data-hue="4">
                  <img src="../src/renderer/assets/avatars/user.png" alt="" />
                </span>
              </div>
            </article>
          </div>
        </div>
      </section>
    </div>
    <script>
      const toggle = document.getElementById('rail-toggle')
      const user = document.getElementById('rail-user')
      const pop = document.getElementById('rail-user-pop')
      toggle.addEventListener('click', () => {
        const collapsed = document.body.dataset.rail === 'collapsed'
        document.body.dataset.rail = collapsed ? 'open' : 'collapsed'
        toggle.setAttribute('aria-expanded', collapsed ? 'true' : 'false')
      })
      user.addEventListener('click', (event) => {
        event.stopPropagation()
        pop.hidden = !pop.hidden
        user.setAttribute('aria-expanded', pop.hidden ? 'false' : 'true')
      })
      pop.addEventListener('click', (event) => event.stopPropagation())
      document.addEventListener('click', () => {
        pop.hidden = true
        user.setAttribute('aria-expanded', 'false')
      })
      const gutter = document.querySelector('.rail-gutter')
      const rail = document.querySelector('.rail')
      let dragging = false
      let originX = 0
      let originWidth = 240
      gutter.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return
        event.preventDefault()
        dragging = true
        originX = event.clientX
        originWidth = rail.getBoundingClientRect().width
        document.body.dataset.railResizing = 'true'
        gutter.setPointerCapture(event.pointerId)
      })
      gutter.addEventListener('pointermove', (event) => {
        if (!dragging) return
        const next = Math.min(420, Math.max(168, originWidth + (event.clientX - originX)))
        document.documentElement.style.setProperty('--rail-width', `${next}px`)
      })
      const endDrag = () => {
        dragging = false
        delete document.body.dataset.railResizing
      }
      gutter.addEventListener('pointerup', endDrag)
      gutter.addEventListener('pointercancel', endDrag)
    </script>
  </body>
</html>
