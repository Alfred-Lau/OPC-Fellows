# 合入 main 后自动升 patch（小版本第三位）、打 tag、构建并发布 GitHub Release。
# 本机签名 / 公证仍走 scripts/sign-mac.sh 与 scripts/notarize-mac.sh；
# CI 只有在仓库 secrets 配齐时才 Developer ID 签名 / 公证，否则 ad-hoc 签名。
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_bump:
        description: Skip version bump and rebuild the current version
        type: boolean
        default: false

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Bump, build, publish
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event.head_commit != null
        && !contains(github.event.head_commit.message, 'chore(release):')
        && !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Bump patch version
        id: bump
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_bump) }}
        run: node scripts/bump-version.mjs

      - name: Read version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, push
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_bump) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/opc-kernel/package.json README.md README.zh-CN.md
          git diff --cached --quiet && {
            echo "version files unchanged" >&2
            exit 1
          }
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git pull --rebase origin main
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "HEAD:main"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Configure macOS signing
        env:
          CSC_LINK_VALUE: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CSC_LINK_VALUE" && -n "$CSC_KEY_PASSWORD_VALUE" ]]; then
            {
              echo "CSC_LINK=$CSC_LINK_VALUE"
              echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_VALUE"
              echo "SIGNED=1"
            } >> "$GITHUB_ENV"
            echo "Developer ID secrets present."
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "No CSC_LINK — electron-builder will ad-hoc sign."
          fi
          if [[ -n "$APPLE_ID_VALUE" && -n "$APPLE_APP_SPECIFIC_PASSWORD_VALUE" && -n "$APPLE_TEAM_ID_VALUE" ]]; then
            {
              echo "APPLE_ID=$APPLE_ID_VALUE"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_VALUE"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_VALUE"
              echo "NOTARIZE=1"
            } >> "$GITHUB_ENV"
          else
            echo "NOTARIZE=0" >> "$GITHUB_ENV"
          fi

      - name: Build macOS arm64
        run: pnpm dist:mac-ci

      - name: Notarize and restaple
        if: env.SIGNED == '1' && env.NOTARIZE == '1'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="dist/mac-arm64/OPC-Fellows.app"
          bash scripts/notarize-mac.sh "$APP"
          ZIP="dist/OPC-Fellows-${VERSION}-mac-arm64.zip"
          rm -f "$ZIP" "${ZIP}.blockmap"
          ditto -c -k --keepParent "$APP" "$ZIP"
          pnpm exec electron-builder --mac dmg --prepackaged "$APP" -c.mac.identity=null

      - name: Compose release notes
        id: notes
        run: |
          {
            echo 'body<<EOF'
            echo "macOS Apple Silicon 安装包。"
            echo
            if [[ "${SIGNED:-0}" == "1" && "${NOTARIZE:-0}" == "1" ]]; then
              echo "已做 Apple Developer ID 签名与公证。"
            elif [[ "${SIGNED:-0}" == "1" ]]; then
              echo "已做 Apple Developer ID 签名（未公证）。首次打开若被拦，执行："
              echo
              echo '```'
              echo 'xattr -cr "/Applications/OPC-Fellows.app"'
              echo '```'
            else
              echo "CI 未配置证书，安装包为 ad-hoc 签名。首次打开若被拦：系统设置 → 隐私与安全性 → 仍要打开，或执行："
              echo
              echo '```'
              echo 'xattr -cr "/Applications/OPC-Fellows.app"'
              echo '```'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OPC-Fellows ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/OPC-Fellows-${{ steps.version.outputs.version }}-mac-arm64.dmg
            dist/OPC-Fellows-${{ steps.version.outputs.version }}-mac-arm64.zip
          body: ${{ steps.notes.outputs.body }}
