appId: tech.bitou.ownworkbuddy
productName: OPC-Fellows
directories:
  output: dist
  buildResources: build
beforeBuild: ./scripts/before-build.cjs
afterPack: ./scripts/after-pack.cjs
npmRebuild: false
files:
  - out/**/*
  - package.json
  - "!node_modules/**"
# dsh 的 node_modules 不能走 extraResources（builder 会丢掉），afterPack 再拷。
# 职业包没有 node_modules，可以直接 extraResources。
extraResources:
  - from: packages/occupation-notes
    to: packages/occupation-notes
  - from: packages/occupation-monitor
    to: packages/occupation-monitor
  - from: packages/occupation-payments
    to: packages/occupation-payments
  - from: packages/occupation-micro
    to: packages/occupation-micro
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  icon: build/icon.icns
  # 签名身份走本机证书发现或环境变量，不要把姓名 / Team ID 写进仓库。
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 公证由 scripts/notarize.sh 单独跑，签名和公证解耦，重试不用重新打包。
  notarize: false
  gatekeeperAssess: false
  category: public.app-category.developer-tools
  extendInfo:
    NSUserNotificationsUsageDescription: OPC-Fellows 会在你设定的时间发送待办桌面通知。
    NSAppleEventsUsageDescription: OPC-Fellows 会在你允许后读取本机「邮件」收件箱，只整理、不代发。
  target:
    - dmg
    - zip
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  target:
    - AppImage
