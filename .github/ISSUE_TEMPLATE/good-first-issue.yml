name: Good first issue
description: A small, well-scoped task for a first-time contributor.
title: "[good first issue] "
labels: ["good first issue", "help wanted"]
body:
  - type: markdown
    attributes:
      value: Maintainers — fill this so a newcomer can finish it in one sitting.
  - type: textarea
    id: task
    attributes:
      label: Task / 任务
      description: One sentence plus the files to touch.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when / 完成标准
      placeholder: pnpm test passes; README.md mentions the new flag; …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - i18n
        - tests
        - examples
        - docs
        - occupation
    validations:
      required: true
