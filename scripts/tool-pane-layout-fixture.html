<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../src/renderer/src/theme.css" />
    <link rel="stylesheet" href="../src/renderer/src/studio-theme.css" />
    <link rel="stylesheet" href="../src/renderer/src/studio.css" />
    <link rel="stylesheet" href="../src/renderer/src/todos.css" />
    <link rel="stylesheet" href="../src/renderer/src/calendar.css" />
    <link rel="stylesheet" href="../src/renderer/src/social-ammo.css" />
    <link rel="stylesheet" href="../src/renderer/src/settings.css" />
    <link rel="stylesheet" href="../src/renderer/src/app.css" />
    <style>
      :root {
        --tool-width: 480px;
      }
    </style>
  </head>
  <body data-view="social-ammo" data-tool="tool">
    <main class="studio" style="height: 100vh">
      <section class="thread-pane"></section>
      <aside class="tool-pane" id="tool-pane">
        <nav class="tool-rail" aria-label="工具面板">
          <div class="tool-rail-tabs" role="tablist">
            <button type="button" class="is-current" title="工具" aria-label="工具">
              <svg class="tool-rail-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14.7 6.3a4 4 0 0 0-5.7 5.4L3 18l3 3 6.3-6a4 4 0 0 0 5.4-5.7l-3.2 3.2-2-2z" />
              </svg>
            </button>
            <button type="button" title="待办" aria-label="待办">
              <svg class="tool-rail-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 6h12M9 12h12M9 18h12" />
                <path d="M4 6h.01M4 12h.01M4 18h.01" />
              </svg>
            </button>
          </div>
        </nav>
        <div class="tool-main">
          <div class="workspace-stage">
            <section id="view-social-ammo" class="view">
              <header class="tick-head">
                <div>
                  <p class="mark">社媒弹药</p>
                  <h1>六平台文案 <span class="tick-count">更新于 9月15日 10:02</span></h1>
                </div>
                <button type="button">装填弹药</button>
              </header>
              <p class="hint">按产品目录写出六平台文案，记下发布和互动。</p>
              <div class="tick-add">
                <span class="tick-plus">+</span>
                <textarea rows="1">添加任务</textarea>
                <input type="datetime-local" />
                <button type="button">添加</button>
              </div>
              <div class="cal-week" id="cal-week">
                <section class="cal-week-col"><button type="button" class="cal-week-head"><span>一</span><b>14</b></button></section>
                <section class="cal-week-col"><button type="button" class="cal-week-head"><span>二</span><b>15</b></button></section>
                <section class="cal-week-col"><button type="button" class="cal-week-head"><span>三</span><b>16</b></button></section>
                <section class="cal-week-col"><button type="button" class="cal-week-head"><span>四</span><b>17</b></button></section>
                <section class="cal-week-col"><button type="button" class="cal-week-head"><span>五</span><b>18</b></button></section>
                <section class="cal-week-col"><button type="button" class="cal-week-head"><span>六</span><b>19</b></button></section>
                <section class="cal-week-col"><button type="button" class="cal-week-head"><span>日</span><b>20</b></button></section>
              </div>
              <div class="skill-grid" id="skill-grid">
                <button type="button" class="skill-mini">装填弹药</button>
                <button type="button" class="skill-mini">发布登记</button>
                <button type="button" class="skill-mini">复盘热帖</button>
              </div>
            </section>
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>
